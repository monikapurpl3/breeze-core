# Breeze Core — credential-guessing detector for the nginx access log.
#
# Deliberately narrow: ONLY authentication failures (401/403).
#
# It previously also matched 400|404|405|422|429, which turned ordinary client
# behaviour into "attacks". The app feature-detects endpoints (404 on an older
# server), the server validates input (422 on an out-of-range setpoint), the
# in-app diagnostics deliberately probes unknown-unit/out-of-range/no-key paths,
# and 429 is our own rate limiter. A legitimate client could therefore trip the
# threshold in seconds — and because clients behind NAT share one address, the
# ban took every user on that connection offline at once. Scanning and probing
# are covered separately by an nginx-scan style jail.
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[^"]*" (?:401|403) 
ignoreregex =
