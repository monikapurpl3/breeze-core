# nginx for the bundled-TLS image: terminate HTTPS, proxy to the app on
# 127.0.0.1:8420. Everything that has to vary per deployment (the server name,
# the redirect target) is generated into /etc/breeze-core/nginx/ by
# breeze-tls-init, so this file itself never needs editing.
#
# Runs entirely as the unprivileged service account: no master-as-root, every
# writable path under /tmp/nginx, listeners above 1024.

worker_processes  1;
pid               /tmp/nginx/nginx.pid;
# `stderr`, the literal keyword -- not /dev/stderr. The keyword makes nginx
# write to the file descriptor it INHERITED; a path makes it open() that path,
# and /dev/stderr is a symlink to /proc/self/fd/2, i.e. PID 1's pipe, which
# containerd owns as root:root 0600. An unprivileged nginx reopening it gets
# "(13: Permission denied)" and refuses to start at all.
error_log         stderr warn;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Off, and nothing is really lost: uvicorn logs every request already, and
    # because it runs with --proxy-headers it logs the REAL client address out
    # of X-Forwarded-For rather than 127.0.0.1. A second access log here would
    # duplicate that -- and it cannot be written to /dev/stdout anyway, for the
    # reopen reason above.
    access_log    off;

    # All of these default under /var/lib/nginx, which an unprivileged master
    # cannot write; nginx then fails at startup on the first buffered request
    # rather than at config-test time, which is a confusing place to find out.
    client_body_temp_path  /tmp/nginx/body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    charset         utf-8;

    # The app compresses its own responses (brotli-asgi), so nginx doing it
    # again would only spend CPU re-compressing already-compressed bytes.
    gzip off;

    # A home panel with a handful of clients; this is a sanity bound, not a
    # throughput knob.
    client_max_body_size 1m;

    # Plain HTTP, purely to bounce people to TLS. The redirect target is
    # generated because it has to name the port YOU published: a bare
    # "https://$host" sends browsers to 443, which is right if you mapped
    # 8443:443 and a dead end if you published 8443 as itself.
    server {
        listen      8080 default_server;
        server_name _;
        include     /etc/breeze-core/nginx/redirect.conf;
    }

    server {
        listen              8443 ssl default_server;
        http2               on;
        include             /etc/breeze-core/nginx/server-name.conf;

        ssl_certificate     /etc/breeze-core/tls/fullchain.pem;
        ssl_certificate_key /etc/breeze-core/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:BREEZE:1m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "same-origin" always;

        location / {
            proxy_pass       http://127.0.0.1:8420;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            # $remote_addr, NEVER $proxy_add_x_forwarded_for: appending would
            # let a client send its own X-Forwarded-For and have it survive,
            # which is exactly how someone off-LAN would talk the app into
            # believing they are on it. Pairing approval is LAN-gated, so this
            # single word is load-bearing.
            proxy_set_header X-Forwarded-For   $remote_addr;

            # The live view is Server-Sent Events (GET /api/units/stream).
            # With buffering on, nginx holds each event until its buffer fills
            # and the UI appears frozen; with a 60s read timeout the stream
            # dies every minute and reconnects. Both are off/long here.
            proxy_buffering    off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
