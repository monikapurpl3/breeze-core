name: Container cleanup

# Prunes the container package back to tags that mean something.
#
# The old Docker workflow tagged every commit as sha-<short>, which left 81 such
# tags plus close to nine hundred untagged manifests, so the GHCR page was
# unreadable and no tag told you what was inside it.
#
# THE TRAP THIS WORKFLOW EXISTS TO AVOID: "delete untagged versions" is the
# obvious way to clean a container package and it is wrong here. Those images are
# multi-arch, so every tag is a manifest *list* whose per-architecture children
# carry no tags of their own -- and buildkit's attestations sit in the same index.
# Deleting untagged versions therefore deletes the insides of the tags you kept:
# `docker pull …:v3.0.5` starts failing with "no matching manifest", and the
# package page still shows the tag as if it were fine. So this resolves every
# surviving tag to the digests it references, and only removes what nothing
# points at.
#
# Dispatch-only, dry-run by default. vX.Y.Z tags are left alone unless asked --
# someone may have pinned one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: true
      delete_sha_tags:
        description: "Delete every sha-* tag (old per-commit builds)"
        type: boolean
        default: true
      delete_stale_latest:
        description: "Delete latest-x86-64-v2 / latest-x86-64-v3 (the confusing pair)"
        type: boolean
        default: true
      delete_unreferenced:
        description: "Delete untagged manifests that no surviving tag references"
        type: boolean
        default: true
      delete_old_version_tags:
        description: "Also delete vX.Y.Z tags older than 3.1 (someone may have pinned these)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Decide and (optionally) delete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pkg = 'breeze-core';
            const owner = context.repo.owner;
            const repo = `${owner}/${context.repo.repo}`.toLowerCase();
            const dry = ${{ inputs.dry_run }};
            const opts = {
              sha: ${{ inputs.delete_sha_tags }},
              staleLatest: ${{ inputs.delete_stale_latest }},
              unreferenced: ${{ inputs.delete_unreferenced }},
              oldVersions: ${{ inputs.delete_old_version_tags }},
            };

            // Paginate: there are over a thousand versions and the default page is
            // 30, so an unpaginated pass prunes the newest few and looks like it
            // worked.
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              { package_type: 'container', package_name: pkg, username: owner, per_page: 100 }
            );
            core.info(`${versions.length} versions in the package`);

            // ---- 1. classify the TAGGED versions -------------------------------
            const keep = [], doom = [];
            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              if (tags.length === 0) continue;              // handled in step 3
              let why = null;
              if (opts.sha && tags.every(t => t.startsWith('sha-'))) why = 'sha-only';
              else if (opts.staleLatest && tags.every(t => /^latest-x86-64-v[23]$/.test(t))) why = 'stale latest-*';
              else if (opts.oldVersions && tags.every(t => /^v[12]\./.test(t) || /^v3\.0\./.test(t))) why = 'pre-3.1 version tag';
              (why ? doom : keep).push({ id: v.id, name: v.name, tags, why });
            }

            // ---- 2. what do the survivors actually point at? -------------------
            // A registry read needs its own token; the Actions token is the
            // password for it.
            const tokRes = await fetch(
              `https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull`,
              { headers: { Authorization: 'Basic ' + Buffer.from(`${owner}:${process.env.GITHUB_TOKEN}`).toString('base64') } });
            const { token } = await tokRes.json();
            const ACCEPT = [
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
            ].join(',');

            const referenced = new Set();
            for (const k of keep) {
              referenced.add(k.name);                       // the index itself
              const ref = k.tags[0];
              const r = await fetch(`https://ghcr.io/v2/${repo}/manifests/${ref}`,
                { headers: { Authorization: `Bearer ${token}`, Accept: ACCEPT } });
              if (!r.ok) { core.warning(`could not read manifest for ${ref}: ${r.status}`); continue; }
              const m = await r.json();
              for (const child of m.manifests ?? []) referenced.add(child.digest);
            }
            core.info(`${keep.length} kept tags reference ${referenced.size} digests`);

            // ---- 3. untagged manifests nothing points at ----------------------
            let orphans = [];
            if (opts.unreferenced) {
              orphans = versions
                .filter(v => (v.metadata?.container?.tags ?? []).length === 0)
                .filter(v => !referenced.has(v.name))
                .map(v => ({ id: v.id, name: v.name, tags: [], why: 'unreferenced' }));
            }
            const kept_children = versions.filter(v =>
              (v.metadata?.container?.tags ?? []).length === 0 && referenced.has(v.name)).length;

            const all = [...doom, ...orphans];
            const label = d => (d.tags.length ? d.tags.join(', ') : d.name.slice(0, 19) + '…');

            core.summary.addHeading(`${pkg}: ${versions.length} versions`, 2);
            core.summary.addRaw(dry ? '**Dry run — nothing deleted.**\n\n' : '**Deleting.**\n\n');
            core.summary.addRaw([
              `- kept tags: **${keep.length}**`,
              `- untagged manifests kept because a surviving tag needs them: **${kept_children}**`,
              `- tagged versions removed: **${doom.length}**`,
              `- unreferenced manifests removed: **${orphans.length}**`,
            ].join('\n') + '\n\n');
            core.summary.addHeading('Kept', 3);
            core.summary.addRaw(keep.map(k => `- ${k.tags.join(', ')}`).join('\n') + '\n\n');
            core.summary.addHeading('Removed', 3);
            core.summary.addRaw(all.map(d => `- ${label(d)} — ${d.why}`).join('\n'));
            await core.summary.write();

            core.info(`keep ${keep.length} tags (+${kept_children} needed children), remove ${all.length}, dry=${dry}`);
            for (const k of keep) core.info(`  keep    ${k.tags.join(', ')}`);
            if (dry) {
              for (const d of all) core.info(`  would remove  ${label(d)} (${d.why})`);
              return;
            }
            let n = 0;
            for (const d of all) {
              await github.rest.packages.deletePackageVersionForUser({
                package_type: 'container', package_name: pkg, username: owner, package_version_id: d.id,
              });
              if (++n % 50 === 0) core.info(`  … ${n}/${all.length}`);
            }
            core.info(`removed ${n}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
