name: Feature request
description: Suggest an improvement to Breeze Core
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: API / auth
        - label: Scheduler / programs
        - label: Web panel
        - label: CLI (diag / approve / devices)
        - label: Packaging (deb / rpm / apk / pacman / OpenWrt / BSD / Windows / Nix)
        - label: A new platform or architecture
        - label: Observability (metrics / history / system info)
        - label: Deployment / docs
  - type: markdown
    attributes:
      value: |
        If this needs the app to change too, please say so — the app lives in
        [breeze](https://github.com/monikapurpl3/breeze) and the two are
        deliberately decoupled: the server never assumes a particular client.
